<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Contact form · Tint</title><link rel="stylesheet" href="../assets/theme.css"></head><body class="blko-theme"><a class="blko-skip-link" href="#content">Skip to content</a><main id="content"><blko-content><section id="content-contact-form" class="blko-content-contact-form"><div><p class="blko-content-kicker">Drop a line</p><h2>Tell us what is going on</h2><p>Add your order number if it is about a purchase. Someone replies within a day.</p></div><form class="blko-content-form" data-content-form novalidate><label for="content-name">Name <span aria-hidden="true">*</span></label><input id="content-name" name="name" autocomplete="name" required><label for="content-email">Email <span aria-hidden="true">*</span></label><input id="content-email" name="email" type="email" autocomplete="email" required><label for="content-topic">Topic</label><select id="content-topic" name="topic"><option>Orders and shipping</option><option>Shade help</option><option>Returns and swaps</option><option>Ingredient question</option></select><label for="content-message">Message <span aria-hidden="true">*</span></label><textarea id="content-message" name="message" rows="5" required></textarea><button class="blko-button" type="submit">Send message</button><p class="blko-content-form-status" data-content-form-status aria-live="polite"></p></form></section></blko-content></main><script type="module" src="../assets/blko-content.js"></script></body></html>
