<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Account registration · Beauty 01</title><link rel="stylesheet" href="../assets/theme.css"></head><body class="blko-theme"><a class="blko-skip-link" href="#content">Skip to content</a><main id="content"><blko-account><section class="blko-account-shell blko-account-register"><div class="blko-account-card">
