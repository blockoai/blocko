<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Contact support form · Tress</title><link rel="stylesheet" href="../assets/theme.css"></head><body class="blko-theme"><a class="blko-skip-link" href="#content">Skip to content</a><main id="content"><section id="content-contact-form" class="blko-content-contact-form"><div><p class="blko-content-kicker">WHAT IS THIS ABOUT</p><h2>Tell us which team you need.</h2><p>Pick a topic and our care team routes your note to the right desk. Please keep card numbers out of the message.</p></div><form action="#content-contact-form" method="get"><label for="content-contact-name">Name</label><input id="content-contact-name" name="name" autocomplete="name" required><label for="content-contact-email">Email address</label><input id="content-contact-email" name="email" type="email" autocomplete="email" required><label for="content-contact-topic">I am reaching out about</label><select id="content-contact-topic" name="topic"><option>Where is my order</option><option>Changing a subscription</option><option>Hair type or scent advice</option><option>Press or partnerships</option><option>Something else</option></select><label for="content-contact-message">Message</label><textarea id="content-contact-message" name="message" rows="5" required></textarea><button class="blko-button" type="submit">Send to care team</button></form></section></main></body></html>
