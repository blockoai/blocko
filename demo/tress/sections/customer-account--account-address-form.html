<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Address form · Tress</title><link rel="stylesheet" href="../assets/theme.css"></head><body class="blko-theme"><a class="blko-skip-link" href="#content">Skip to content</a><main id="content"><blko-account><section class="blko-account-address-form" data-account-address-form hidden><div class="blko-account-address-form-card"><header class="blko-account-section-heading"><div><p class="blko-account-eyebrow">Delivery details</p><h2 data-account-address-title>Add address</h2></div><button class="blko-account-text-button" type="button" data-account-address-close>Close</button></header><form data-account-form data-account-action="Address saved"><div class="blko-account-form-grid blko-account-form-grid--split"><label class="blko-account-field" for="account-address-first-name"><span>First name</span><input id="account-address-first-name" type="text" placeholder="First name" autocomplete="given-name" required></label><label class="blko-account-field" for="account-address-last-name"><span>Last name</span><input id="account-address-last-name" type="text" placeholder="Last name" autocomplete="family-name" required></label></div><div class="blko-account-form-grid"><label class="blko-account-field" for="account-address-line"><span>Address</span><input id="account-address-line" type="text" placeholder="Address" autocomplete="street-address" required></label><label class="blko-account-field" for="account-address-city"><span>City</span><input id="account-address-city" type="text" placeholder="City" autocomplete="address-level2" required></label></div><div class="blko-account-form-grid blko-account-form-grid--split"><label class="blko-account-field" for="account-address-region"><span>Region</span><input id="account-address-region" type="text" placeholder="Region" autocomplete="address-level1" required></label
