<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Account sign in · Clip</title><link rel="stylesheet" href="../assets/theme.css"></head><body class="blko-theme"><a class="blko-skip-link" href="#content">Skip to content</a><main id="content"><blko-account><section class="blko-account-shell blko-account-login" data-account-auth>
      <div class="blko-account-card">
        <div data-account-panel="signin">
          <p class="blko-account-kicker">Your account</p><h1>Welcome back.</h1><p>Sign in to view your orders and saved details.</p>
          <form data-account-form data-account-action="Sign-in demo"><div class="blko-account-fields"><label class="blko-account-field" for="account-login-email"><span>Email address</span><input id="account-login-email" type="email" autocomplete="email" required></label><label class="blko-account-field" for="account-login-password"><span>Password</span><input id="account-login-password" type="password" autocomplete="current-password" required></label></div><button class="blko-button" type="submit">Sign in</button><p class="blko-account-form-message" aria-live="polite" data-account-form-message></p></form>
          <nav class="blko-account-auth-links" aria-label="Account options"><a href="../pages/account-register.html">Create an account</a><button type="button" class="blko-account-text-button" data-account-show="recover">Reset password</button></nav>
        </div>
        <div hidden data-account-panel="recover">
          <p class="blko-account-kicker">Password help</p><h2>Reset your password.</h2><p>Enter your email and we’ll prepare a reset link.</p>
          <form data-account-form data-account-action="Password reset demo"><div class="blko-account-fields"><label class="blko-account-field" for="account-recover-email"><span>Email address</span><input id="account-recover-email" type="email" autocomplete="email" required></label></div><button class="blko-button" type="submit">Send reset link</button><p class="blko-account-form-message" aria-live="polite" data-account-form-message></p></form>
          <button type="button" class="blko-account-text-button" data-account-show="signin">Return to sign in</button>
        </div>
      </div>
    </section></blko-account></main><script type="module" src="../assets/blko-account.js"></script></body></html>
