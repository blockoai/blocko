<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Account activation · Beauty 02</title><link rel="stylesheet" href="../assets/theme.css"></head><body class="blko-theme"><a class="blko-skip-link" href="#content">Skip to content</a><main id="content"><blko-account><section class="blko-account-auth">
    <a class="blko-account-auth-brand" href="../pages/account-login.html" aria-label="Brand account home">Brand</a>
    <div class="blko-account-auth-panel">
      <h1>Activate account</h1><p class="blko-account-auth-intro">Choose a password to finish setting up</p>
      
      <form data-account-form data-account-action="Activate account"><label class="blko-account-field" for="account-activate-password"><span>Password</span><input id="account-activate-password" type="password" placeholder="Password" autocomplete="new-password" required></label><label class="blko-account-field" for="account-activate-confirm-password"><span>Confirm password</span><input id="account-activate-confirm-password" type="password" placeholder="Confirm password" autocomplete="new-password" required></label><button class="blko-account-auth-submit" type="submit"><span>Activate account</span><span aria-hidden="true">→</span></button><p class="blko-account-form-message" aria-live="polite" data-account-message></p></form>
      
      <button class="blko-account-auth-decline" type="button" data-account-notice="Activation was declined in this demonstration.">Decline invitation</button>
      <nav class="blko-account-auth-links" aria-label="Account options"><a href="../pages/account-login.html">Sign in</a></nav>
    </div>
    <a class="blko-account-auth-privacy" href="#privacy">Privacy policy</a>
  </section></blko-account></main><script type="module" src="../assets/blko-account.js"></script></body></html>
